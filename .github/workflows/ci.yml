name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    qualita:
        name: Lint e formattazione
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check

    test:
        name: Test API
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root-ci
                    MYSQL_DATABASE: trello_test
                    MYSQL_USER: trello
                    MYSQL_PASSWORD: trello-ci
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -ptrello-ci -utrello"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_NAME: trello_test
            DB_USER: trello
            DB_PASSWORD: trello-ci
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test

    build:
        name: Build del client
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
